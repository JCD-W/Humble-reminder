services:
  db:
    profiles:
      - prod
      - dev
    image: mysql:8.0
    container_name: hr-database
    ports:
      - '3306:3306'
    expose:
      - '3306'
    environment:
      MYSQL_USER: "example_user"
      MYSQL_PASSWORD: "example_pass"
      MYSQL_ROOT_PASSWORD: "example_pass"
      MYSQL_DATABASE: "humble_reminder_db"
    volumes:
      - ./database:/docker-entrypoint-initdb.d
  backend:
    profiles:
      - prod
      - dev
    container_name: hr-backend
    build:
      context: backend
      target: backend
    command: npm start
    ports:
      - 3000:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SERVER_PORT=3000
      - DATABASE_HOST=host.docker.internal
      - DATABASE_USER=example_user
      - DATABASE_PASS=example_pass
      - DATABASE_PORT=3306
      - DATABASE_NAME=humble_reminder_db
      - FRONTEND_URL=http://localhost:4000
    depends_on:
      - db
  frontend-dev:
    profiles:
      - dev
    container_name: hr-frontend-dev
    build:
      context: frontend
      target: frontend
    ports:
      - 4000:4000
    volumes:
      - ./frontend:/src
      - /src/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
  frontend:
    profiles:
      - prod
    container_name: hr-frontend
    build:
      context: frontend
      target: frontend
    ports:
      - 4000:4000
volumes:
  database: